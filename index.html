<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pandeyji Eatery</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Dialogflow Messenger -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>Pandeyji Eatery</h1>
        <nav>
            <a href="#home">HOME</a>
            <a href="#menu">MENU</a>
            <a href="#location">LOCATION</a>
            <a href="#contact">CONTACT</a>
        </nav>
    </header>

    <!-- HOME -->
    <section id="home">
        <img src="banner.jpg" alt="Pandeyji Banner">
    </section>

    <!-- MENU -->
    <section id="menu">
        <h2>Our Menu</h2>

        <div class="grid-container">
            <div class="card">
                <img src="menu1.jpg">
                <span>Samosa — $5</span>
            </div>

            <div class="card">
                <img src="menu2.jpg">
                <span>Pav Bhaji — $6</span>
            </div>

            <div class="card">
                <img src="menu3.jpg">
                <span>Chole Bhature — $7</span>
            </div>
        </div>
    </section>

    <!-- LOCATION -->
    <section id="location">
        <h2>Location</h2>
        <p>38 Patli Gali, Mumbai</p>
    </section>

    <!-- CONTACT -->
    <section id="contact">
        <h2>Contact Us</h2>
        <p>
            📞 +91 791234567<br>
            ✉️ info@pandeyjieatery.com
        </p>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 Pandeyji Eatery | Fresh & Delicious</p>
    </footer>

</div>

<!-- 🟢 OFFICIAL DIALOGFLOW CHATBOT -->
<df-messenger
    intent="WELCOME"
    chat-title="Pandeyji Eatery"
    agent-id="1c28315d-dd49-4059-abef-522cc2e299f9"
    language-code="en">
</df-messenger>

</body>
</html>
